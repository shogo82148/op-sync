name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: test
        run: |
          go test -v -coverprofile=profile.cov ./...

      - name: upload coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./profile.cov
          token: ${{ secrets.CODECOV_TOKEN }}

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check GoReleaser configure
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: "~> v2"
          args: check
