name: tagpr

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: generate GitHub App Token
        id: generate
        uses: shogo82148/actions-github-app-token@v1.0.3

      - name: Check out source code
        uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false

      - id: run-tagpr
        name: Run tagpr
        uses: Songmu/tagpr@v1.9.0
        env:
          GITHUB_TOKEN: ${{ steps.generate.outputs.token }}
